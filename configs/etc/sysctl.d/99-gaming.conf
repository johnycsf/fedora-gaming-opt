# Gaming performance sysctl for Fedora gaming PCs

# Keep game memory resident; swap only under pressure
vm.swappiness = 10

# Required by some Proton/Wine titles
vm.max_map_count = 2147483642

# Reduce scheduler bias toward background desktop tasks during gaming
kernel.sched_autogroup_enabled = 0

# Faster memory reclaim tradeoff for game workloads
vm.vfs_cache_pressure = 50

# Larger network buffers for downloads / online play
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
