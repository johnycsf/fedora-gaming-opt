# Gaming performance sysctl for Fedora gaming PCs

# Optional, conservative compatibility preset. Install only with
# ./manage.sh install --sysctl-tweaks.
# Keep game memory resident; swap only under pressure.
vm.swappiness = 10

# Compatibility headroom for games with unusually many memory maps. This is
# deliberately bounded; do not use an effectively unlimited value globally.
vm.max_map_count = 1048576

# Moderate cache reclaim tradeoff for desktop game workloads.
vm.vfs_cache_pressure = 50
